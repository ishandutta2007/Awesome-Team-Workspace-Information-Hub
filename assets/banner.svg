<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="badgeGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bg-rect { fill: url(#bgGrad); }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: url(#textGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #cbd5e1;
      }
      .grid-line {
        stroke: #334155;
        stroke-opacity: 0.25;
        stroke-width: 1;
      }

      /* Animated dynamic background orbs and pulses */
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(60px, 30px) scale(1.15); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1.1); }
        50% { transform: translate(-50px, -25px) scale(0.95); }
        100% { transform: translate(0px, 0px) scale(1.1); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { r: 5px; opacity: 0.5; }
        50% { r: 8px; opacity: 0.9; }
      }
      @keyframes cardFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .animated-orb1 {
        animation: floatOrb1 16s ease-in-out infinite;
      }
      .animated-orb2 {
        animation: floatOrb2 20s ease-in-out infinite;
      }
      .data-stream {
        stroke-dasharray: 12, 12;
        animation: flowLine 25s linear infinite;
      }
      .node-pulse {
        animation: pulseNode 3s ease-in-out infinite;
      }
      .floating-card-1 {
        animation: cardFloat 5s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: cardFloat 6s ease-in-out infinite 1.5s;
      }
      .floating-card-3 {
        animation: cardFloat 5.5s ease-in-out infinite 3s;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg-rect" rx="16"/>

  <!-- Subtle Architectural Grid Behind All Text -->
  <g opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="360" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="360" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="360" class="grid-line" />
    <line x1="1150" y1="0" x2="1150" y2="360" class="grid-line" />
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
  </g>

  <!-- Dynamic Animated Glow Orbs (Strictly in Background) -->
  <g>
    <circle cx="180" cy="110" r="160" fill="url(#glowGrad1)" class="animated-orb1" />
    <circle cx="1020" cy="240" r="210" fill="url(#glowGrad2)" class="animated-orb2" />
  </g>

  <!-- Dynamic Data Stream Vectors (Subtle in Background) -->
  <g opacity="0.3">
    <path d="M 60 40 C 300 20, 450 180, 750 120 S 1080 300, 1160 320" fill="none" stroke="#60a5fa" stroke-width="2" class="data-stream" />
    <path d="M 40 320 C 260 280, 520 200, 840 250 S 1040 60, 1160 40" fill="none" stroke="#a78bfa" stroke-width="1.5" class="data-stream" style="animation-direction: reverse; animation-duration: 35s;" />
  </g>

  <!-- Interactive Dynamic Background Node Elements -->
  <circle cx="340" cy="50" r="5" fill="#38bdf8" class="node-pulse" />
  <circle cx="890" cy="70" r="6" fill="#a78bfa" class="node-pulse" style="animation-delay: 1s;" />
  <circle cx="150" cy="300" r="5" fill="#60a5fa" class="node-pulse" style="animation-delay: 2s;" />
  <circle cx="1060" cy="120" r="6" fill="#818cf8" class="node-pulse" style="animation-delay: 1.5s;" />

  <!-- Dynamic Ambient Badges / Tech Tags at Bottom (Below Text) -->
  <g class="floating-card-1">
    <g transform="translate(180, 275)">
      <rect width="180" height="42" rx="21" fill="url(#pillGrad)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="26" cy="21" r="7" fill="#3b82f6"/>
      <text x="44" y="26" class="tag-text">Team Wikis &amp; Docs</text>
    </g>
  </g>

  <g class="floating-card-2">
    <g transform="translate(390, 275)">
      <rect width="200" height="42" rx="21" fill="url(#pillGrad)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="26" cy="21" r="7" fill="#8b5cf6"/>
      <text x="44" y="26" class="tag-text">Knowledge Hubs &amp; RAG</text>
    </g>
  </g>

  <g class="floating-card-3">
    <g transform="translate(620, 275)">
      <rect width="190" height="42" rx="21" fill="url(#pillGrad)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="26" cy="21" r="7" fill="#06b6d4"/>
      <text x="44" y="26" class="tag-text">Self-Hosted / Open Source</text>
    </g>
  </g>

  <g class="floating-card-1">
    <g transform="translate(840, 275)">
      <rect width="180" height="42" rx="21" fill="url(#pillGrad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="26" cy="21" r="7" fill="#ec4899"/>
      <text x="44" y="26" class="tag-text">SaaS Cloud Platforms</text>
    </g>
  </g>

  <!-- Foreground Title and Subtitle (Crisp, High Contrast, Layered on Top) -->
  <g filter="url(#shadow)">
    <!-- Top Pill Indicator -->
    <g transform="translate(460, 42)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="15" r="4" fill="#10b981" />
      <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">CURATED ARCHITECTURE GUIDE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" class="title-text">Awesome Team Workspace &amp; Information Hub</text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" class="subtitle-text">Curated Guide to Enterprise Information Hubs, Knowledge Bases &amp; Self-Hosted Wikis</text>
    <text x="600" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b" font-weight="500">Comprehensive Comparison of SaaS Platforms and Top Open-Source Frameworks</text>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
